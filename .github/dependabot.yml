# Dependabot: open PRs when dependencies have new versions.
# Review and run tests (or manual smoke test) before merging, especially for minecraft-launcher-lib.
# See docs/MAINTENANCE.md for upgrade notes.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
