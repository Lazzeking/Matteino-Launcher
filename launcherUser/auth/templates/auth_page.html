<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} - {{PAGE_TITLE}}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f0f1a 100%);
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(30, 30, 46, 0.95);
      border: 1px solid #3d3d5c;
      border-radius: 12px;
      padding: 32px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .logo {
      max-width: 180px;
      max-height: 80px;
      object-fit: contain;
      margin-bottom: 24px;
    }
    .logo-placeholder {
      font-size: 1.5rem;
      font-weight: 700;
      color: #7c8cc4;
      margin-bottom: 24px;
      letter-spacing: 0.02em;
    }
    .title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .success .title { color: #7dd3a0; }
    .error .title { color: #e07c7c; }
    .message {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #b0b0c0;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: center;
    }
    .error .message { color: #d0a0a0; }
    .close-row {
      margin-top: 20px;
    }
    #countdown {
      font-size: 0.9rem;
      color: #9ab;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card {{STATUS_CLASS}}">
    {{LOGO_IMG}}
    <p class="title">{{TITLE}}</p>
    <p class="message">{{MESSAGE}}</p>
    {{SUCCESS_EXTRA}}
  </div>
</body>
</html>
